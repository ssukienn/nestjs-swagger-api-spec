name: Publish
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  push:
    branches:
      - "main"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      # Node 24 ships npm 11.5+, required for OIDC trusted publishing.
      # Do not set registry-url: setup-node would write an empty _authToken
      # and npm would skip the OIDC flow.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create-github-releases: false
          push-git-tags: false
      # pnpm-workspace.yaml makes Changesets treat this as a workspace, so its
      # default tags are name@version. Keep the historical vX.Y.Z GitHub releases.
      - name: Create v-prefixed GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          pkgs = json.loads(os.environ["PUBLISHED_PACKAGES"])
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          for pkg in pkgs:
              version = pkg["version"]
              tag = f"v{version}"
              match = re.search(
                  rf"^## {re.escape(version)}\n\n(.*?)(?=\n## |\Z)",
                  changelog,
                  re.S | re.M,
              )
              notes = match.group(1).strip() if match else f"Release {version}"
              pathlib.Path("/tmp/release-notes.md").write_text(notes)
              subprocess.check_call(["git", "tag", tag])
              subprocess.check_call(["git", "push", "origin", tag])
              subprocess.check_call(
                  [
                      "gh",
                      "release",
                      "create",
                      tag,
                      "--title",
                      tag,
                      "--notes-file",
                      "/tmp/release-notes.md",
                  ]
              )
          PY
