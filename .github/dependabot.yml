version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): update"
    labels:
      - "dependencies"
    # example/ is an integration-test fixture, not a published app
    exclude-paths:
      - "example/**"
    ignore:
      - dependency-name: "node"
        versions:
          - "20"
          - "22"
          - "23"
      - dependency-name: "@nestjs/common"
        versions:
          - "10"
      - dependency-name: "@nestjs/swagger"
        versions:
          - "7"
          - "8"
  # Ignore version and security PRs for the e2e fixture manifests.
  - package-ecosystem: "npm"
    directory: "/example/typescript-starter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
